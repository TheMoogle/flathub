app-id: io.github.NSMBMarioVsLuigi
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: mariovsluigi
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=all
  - --share=network
  - --socket=pulseaudio

modules:
  - name: mariovsluigi
    buildsystem: simple
    build-commands:
      - install -D linux.x86_64 ${FLATPAK_DEST}/share/mariovsluigi/linux.x86_64
      - install -D UnityPlayer.so ${FLATPAK_DEST}/share/mariovsluigi/UnityPlayer.so
      - install -D libdecor-0.so.0 ${FLATPAK_DEST}/share/mariovsluigi/libdecor-0.so.0
      - install -D libdecor-cairo.so ${FLATPAK_DEST}/share/mariovsluigi/libdecor-cairo.so
      - cp -r linux_Data ${FLATPAK_DEST}/share/mariovsluigi/
      - install -Dm755 mariovsluigi.sh ${FLATPAK_DEST}/bin/mariovsluigi
      - install -Dm644 io.github.NSMBMarioVsLuigi.desktop ${FLATPAK_DEST}/share/applications/io.github.NSMBMarioVsLuigi.desktop
      - install -Dm644 io.github.NSMBMarioVsLuigi.metainfo.xml ${FLATPAK_DEST}/share/appdata/io.github.NSMBMarioVsLuigi.metainfo.xml
      - install -Dm644 NSMBMarioVsLuigi.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.NSMBMarioVsLuigi.png
    sources:
      - type: archive
        url: https://github.com/ipodtouch0218/NSMB-MarioVsLuigi/releases/download/v2.0.3.0/MarioVsLuigi-Linux-v2.0.3.0.zip
        sha256: 402e98ba42d13b528ef00282bb5fe7129aaddfa456461ea0e695589f69abbbf5
      - type: file
        path: io.github.NSMBMarioVsLuigi.desktop
      - type: file
        path: io.github.NSMBMarioVsLuigi.metainfo.xml
      - type: file
        path: NSMBMarioVsLuigi.png
      - type: script
        dest-filename: mariovsluigi.sh
        commands:
        - cd /app/share/mariovsluigi
        - ./linux.x86_64
